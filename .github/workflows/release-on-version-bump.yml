name: Manual Release Verification

# CODEX.md §11: the approved local ZIP is published only by the authorized
# maintainer flow. This optional post-publication check cannot issue or edit it.
on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full final commit of the published tag (not a branch name)
        required: true
        type: string
      approved_zip_sha256:
        description: SHA-256 of the original ZIP installed and approved by the user
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-on-version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin verification to published source on main
        env:
          FINAL_SHA: ${{ inputs.release_commit }}
          ZIP_SHA: ${{ inputs.approved_zip_sha256 }}
        run: |
          set -eu
          [[ "$FINAL_SHA" =~ ^[0-9a-f]{40}$ && "$ZIP_SHA" =~ ^[0-9a-fA-F]{64}$ ]]
          git merge-base --is-ancestor "$FINAL_SHA" "$GITHUB_SHA"
          git switch --detach "$FINAL_SHA"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Build verified source (runner output is never published)
        run: bun run build

      - name: Verify stable Latest metadata and original customer bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_SHA: ${{ inputs.approved_zip_sha256 }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./komari-theme.json').version")
          tag="v$version"
          asset="Glassmorphism-Plus-release-$version.zip"
          test "$(git rev-parse --verify "refs/tags/$tag^{commit}")" = "$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/release-meta.json"
          jq -e --arg tag "$tag" --arg asset "$asset" '
            .tag_name == $tag and .name == $tag and .draft == false and .prerelease == false
            and (.assets | length == 1) and .assets[0].name == $asset
          ' "$RUNNER_TEMP/release-meta.json"
          dest=$(mktemp -d "$RUNNER_TEMP/approved-zip.XXXXXXXX")
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$dest"
          cd "$dest"
          printf '%s  %s\n' "$ZIP_SHA" "$asset" | sha256sum --check --strict
          test "$(stat -c %s "$asset")" = "$(jq -r '.assets[0].size' "$RUNNER_TEMP/release-meta.json")"
          unzip -tq "$asset"
          for item in komari-theme.json LICENSE; do
            unzip -p "$asset" "$item" | cmp - "$GITHUB_WORKSPACE/$item"
          done
          unzip -p "$asset" preview.png | cmp - "$GITHUB_WORKSPACE/docs/preview.png"
          unzip -p "$asset" dist/index.html > "$dest/index.html"
          grep -Fq '<script' "$dest/index.html"
