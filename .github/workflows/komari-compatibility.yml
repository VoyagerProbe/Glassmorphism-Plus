name: Komari Release Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      previous_installer_url:
        description: Optional same-version old candidate URL (read-only download)
        type: string
        required: false
      previous_installer_sha256:
        description: Required SHA-256 when an old candidate URL is supplied
        type: string
        required: false

permissions:
  contents: read

jobs:
  official-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Locked dependencies
        run: |
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
      - name: Browser
        run: bunx playwright install --with-deps chromium
      - name: Build one candidate installer for every backend
        run: bun run build
      - name: Locate versioned installer
        id: package
        run: node -e 'const v = require("./komari-theme.json").version; const p = require("node:path").resolve("..", v, `Glassmorphism-Plus-release-${v}.zip`); require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `path=${p}\n`)'
      - name: Official release matrix on the same ZIP
        env:
          KOMARI_SW_LAB_ROOT: ${{ runner.temp }}/plus-komari-lab
          KOMARI_SW_FIXTURES: ${{ runner.temp }}/plus-komari-inputs
          PLUS_COMPAT_REPORT: ${{ runner.temp }}/komari-compatibility.json
        run: node tests/compatibility/komari-releases.mjs
      - name: Same-version candidate upgrade on official 1.6.0
        if: github.event_name == 'workflow_dispatch' && inputs.previous_installer_url != ''
        env:
          KOMARI_SW_LAB_ROOT: ${{ runner.temp }}/plus-revision-lab
          KOMARI_SW_FIXTURES: ${{ runner.temp }}/plus-komari-inputs
          KOMARI_COMPAT_VERSIONS: 1.6.0
          PLUS_PREVIOUS_URL: ${{ inputs.previous_installer_url }}
          PLUS_PREVIOUS_SHA: ${{ inputs.previous_installer_sha256 }}
          PLUS_COMPAT_REPORT: ${{ runner.temp }}/revision-compatibility.json
        run: node tests/compatibility/komari-releases.mjs
      - name: Retain verified candidate and sanitized evidence
        uses: actions/upload-artifact@v6
        with:
          name: komari-verified-installer
          path: |
            ${{ steps.package.outputs.path }}
            ${{ runner.temp }}/komari-compatibility.json
            ${{ runner.temp }}/revision-compatibility.json
          if-no-files-found: error
          retention-days: 14
