name: Service Worker Compatibility

on:
  push:
    branches:
      - main
      - compat/v2.8.2-sw
  pull_request:

permissions:
  contents: read

jobs:
  linux-original-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Locked dependencies
        run: |
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
      - name: Browser engines for compatibility checks
        run: bunx playwright install --with-deps chromium webkit
      - name: Compatibility lifecycle and safety contracts
        run: node --test tests/service-worker/worker.test.mjs
      - name: Build current candidate (no release artifact overwrite)
        env:
          KOMARI_SKIP_PACKAGE: '1'
        run: bun run build-only
      - name: Official fix1 route and old-profile evidence
        env:
          KOMARI_SW_LAB_ROOT: ${{ runner.temp }}/plus-sw-lab
          KOMARI_SW_FIXTURES: ${{ runner.temp }}/plus-sw-inputs
        run: node tests/service-worker/migration.mjs
      - name: WebKit natural worker migration and current UI
        env:
          KOMARI_SW_LAB_ROOT: ${{ runner.temp }}/plus-sw-lab
          KOMARI_SW_FIXTURES: ${{ runner.temp }}/plus-sw-inputs
        run: node tests/service-worker/webkit.mjs
      - name: Sanitized migration result only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: service-worker-migration-evidence
          path: |
            ${{ runner.temp }}/plus-sw-lab/*/migration.json
            ${{ runner.temp }}/plus-sw-lab/*/webkit-compat.json
          if-no-files-found: error
          retention-days: 14
