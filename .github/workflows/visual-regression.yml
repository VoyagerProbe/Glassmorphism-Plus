name: Visual Regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          git ls-files --error-unmatch bun.lock
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build visual test artifact
        run: KOMARI_SKIP_PACKAGE=1 bun run build-only

      - name: Reproduce Tooltip regressions with locked dependencies
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/tooltip-diagnostic/summary.json
        run: >-
          node node_modules/@playwright/test/cli.js test
          --grep 'five modal cycles preserve dual chart|gesture guards reject out-and-back|native Chromium touch drags and release'
          --output=test-results/tooltip-diagnostic/artifacts
          --reporter=line,json

      - name: Run complete visual regression suite
        # The focused diagnostic above does not filter or replace this suite.
        run: node node_modules/@playwright/test/cli.js test

      - name: Upload visual differences
        # Also retain the machine-readable full-suite result on success.
        # Hard job cancellation can still prevent this step from running.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-diffs
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  webkit-tooltip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          git ls-files --error-unmatch bun.lock
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock

      - name: Install WebKit
        run: bunx playwright install --with-deps webkit

      - name: Build mobile test artifact
        run: KOMARI_SKIP_PACKAGE=1 bun run build-only

      - name: Verify WebKit mobile Tooltip lifecycle
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit-tooltip-summary.json
        # Native CDP drag is Chromium-only; WebKit exercises browser tap,
        # cancellation classification, DOM scroll retention and modal cleanup.
        run: >-
          node node_modules/@playwright/test/cli.js test
          --config playwright.webkit.config.ts --project webkit-iphone
          --grep 'touch scrolling survives compatibility leave|gesture guards reject out-and-back|five modal cycles preserve dual chart|ten cycles preserve chart state|tap dismisses|mobile long-list numeric'
          --reporter=line,json

      - name: Upload WebKit Tooltip results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: webkit-tooltip-results
          path: test-results/
          if-no-files-found: error
          retention-days: 14
