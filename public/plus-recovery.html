<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Glassmorphism Plus · 浏览器兼容恢复</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      body {
        max-width: 38rem;
        margin: 3rem auto;
        padding: 0 1.2rem;
      }
      button,
      a {
        display: inline-block;
        padding: 0.7rem 1rem;
        margin: 0.4rem 0.4rem 0.4rem 0;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      #status {
        border-inline-start: 0.25rem solid #16a085;
        padding: 0.8rem;
        overflow-wrap: anywhere;
      }
    </style>
    <script src="./plus-recovery.js" defer></script>
  </head>
  <body>
    <h1>浏览器兼容恢复</h1>
    <p>
      旧浏览器组件可能仍在提供更新前的页面。本页不依赖监控主应用；只更新本实例已有的兼容组件，不清除登录、收藏、颜色或三网绑定。
    </p>
    <p>更新后采用在线访问，同源前台及后台不再使用旧组件的离线外壳。不会自动刷新其他标签页或后台表单。</p>
    <p id="status" role="status" aria-live="polite">正在检测浏览器能力……</p>
    <button id="update" type="button" disabled>更新浏览器兼容组件</button>
    <a id="home" href="/">返回监控首页</a>
    <p>
      需要联网。只有组件已激活并接管本页才会显示已完成；之后请点击返回首页。若未完成，可稍后重试，不需要清除网站数据。
    </p>
    <noscript>浏览器禁用了 JavaScript，无法执行兼容检查。请启用后重新打开本页。</noscript>
  </body>
</html>
